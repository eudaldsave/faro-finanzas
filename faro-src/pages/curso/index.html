{{> header}}

<main id="contenido">
  <section class="page-hero page-hero--left">
    <div class="hero__glow" aria-hidden="true"></div>
    <div class="wrap">
      <span class="pill">Mi curso</span>
      <h1 id="course-title">Tu itinerario de <span class="gold">inversión</span></h1>
      <p class="lead" id="course-lead">Cinco módulos, de leer las cuentas de una empresa a diseñar tu cartera. El módulo 1 es gratis.</p>
      <div class="course-progress" id="course-progress" role="progressbar" aria-label="Progreso del curso" aria-valuemin="0" hidden><span id="course-bar"></span></div>
      <a class="btn btn--gold btn--lg" id="course-continue" href="leccion.html?id=m1-01" hidden>Empezar la lección 1 →</a>
    </div>
  </section>

  <section class="page page--light">
    <div class="wrap">
      {{> course-gate}}
      <p class="form-msg" id="course-msg" role="alert"></p>
      <div class="course" id="course-modules"></div>
    </div>
  </section>
</main>

{{> footer}}
{{> supabase}}
